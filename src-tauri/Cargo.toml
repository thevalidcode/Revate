[package]
name = "revate"
version = "0.1.0"
description = "A local-first, open-source screen recorder and auto-editor"
authors = ["Revate Contributors"]
edition = "2021"

[lib]
name = "revate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "revate"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2.x core framework
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Signals. Used to ask FFmpeg to finalize a capture (SIGINT is FFmpeg's graceful
# quit, and unlike `q` on stdin it cannot be lost). Already in the tree through
# rdev/tokio — declaring it directly keeps the dependency honest.
libc = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Input capture
# rdev: Cross-platform keyboard and mouse events
rdev = "0.1.0"

# Audio
# cpal: Cross-platform audio I/O
cpal = "0.15"
# hound: WAV file reading/writing
hound = "3.5"

# FFmpeg integration
# ffmpeg-sidecar: FFmpeg binary management
ffmpeg-sidecar = "0.1.0"
chrono = "0.4.45"
tauri-plugin-dialog = "2.8.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
